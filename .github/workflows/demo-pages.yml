name: Demo — Deploy live preview to GitHub Pages

# Builds the frontend in demo mode (no backend, sample data) and publishes it
# to https://<owner>.github.io/<repo>/ on every push to main.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci rejects this lockfile due to an npm bug with the bundled deps of
      # @tailwindcss/oxide-wasm32-wasi (optional, never installed on Linux x64).
      - run: npm install --no-audit --no-fund

      - name: Build demo
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APP_NAME: Social Media CMS
        run: npm run build

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so deep
      # links like /library resolve to the app instead of a Pages 404.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
